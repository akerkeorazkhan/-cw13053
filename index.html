<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

  body{
    background-color:  rgb(82, 82, 223) ;
  }

  .container{

    background-color: white;
    width: 80vw;
    max-width: 37.5em;
    padding: 3em 2.5em;
    position: absolute  ;
    transform: translate(-50%, -50%);
    left: 50%;
    top: 50%;
    border-radius: 0.62em;
    box-shadow: 0 1.25em 1.8em rgba(8, 21, 65, 0.25);
  }
.search-wrapper{
    display: grid;
    grid-template-columns: 9fr 3fr;
    gap: 1.25em;
}
.search-wrapper button{
    font-size: 1em;
    background-color: rgb(74, 74, 189);
    border-radius: 1.5em;
    color: white;
    border: none;
    padding: 0.8em 0;
}
.search-wrapper input{
     font-size: 1em;
     padding: 0 0.62em;
     border: none;
     border-bottom: 2px solid rgb(82, 82, 213);
     outline: none;
     color: rgb(63, 56, 44);
}
#result{
margin-top: 1.2em ;

}

.container  .flag-img {
    display:block;
    width: 45%;
    min-width: 7.5em;
    margin: 1.8em auto 1.2em auto;
}
.container h2{
     font-weight: 600;
     color: rgb(61, 34, 1);
     text-align: center;
     text-transform: uppercase;
     letter-spacing: 2px;
     margin-bottom: 1.8em; 
}
.data-wrapper{
    margin-bottom: 1em;
    letter-spacing: 0.3px;
}
.container h4{
    display: inline;
    font-weight: 500;
    color: rgb(61, 34, 1);
}

.container span{
    color: #5d6274;
}

.container h3{
    text-align: center;
}
</style>
<body>
    <div class="container">
        <div class="search-wrapper">
   <input id="country-inp"  type="text" placeholder="Enter a country name here...">
   <button id="searched-btn">Search</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
     let searchBtn = document.getElementById("searched-btn");
     let countryInp = document.getElementById("country-inp");
     let result = document.getElementById("result");

     searchBtn.addEventListener("click", () => {
        let countryName = countryInp.value;
        let finalURL= `https://restcountries.com/v3.1/name/${countryName}?fullText=true`;
        console.log(finalURL);
        fetch(finalURL)
        .then((response) => response.json())
        .then((data) => {
            console.log(data[0]);
            console.log(data[0].capital[0]);
            console.log(data[0].flags.svg);
            console.log(data[0].name.common);
            console.log(data[0].continents[0]);
            console.log(Object.keys(data[0].currencies)[0]);
            console.log(data[0].currencies[
                Object.keys(data[0].currencies)
                [0]].name);
            console.log(
                Object.values(data[0].languages).toString().
                split(",").join(","));

            result.innerHTML = `
           <img src="${data[0].flags.svg}" class="flag-img">
            <h2>${data[0].name.common}</h2>
            <div class="wrapper">
                <div class="data-wrapper">
                    <h4>Capital:</h4>
                    <span>${data[0].capital[0]}</span>
                    </div>
            </div>

                <div class="wrapper">
                <div class="data-wrapper">
                    <h4>Continent :</h4>
                    <span>${data[0].continents[0]}</span>
                    </div>
            </div>

                  <div class="wrapper">
                <div class="data-wrapper">
                    <h4>Population:</h4>
                    <span>${data[0].population}</span>
                    </div>
            </div>

                  <div class="wrapper">
                <div class="data-wrapper">
                    <h4>Currency:</h4>
                   <span>
                    ${data[0].currencies[
                    Object.keys(data[0].currencies)[0]
                    ].name}
                    
                    - ${Object.keys(data[0].currencies)[0]}
                    </span>
                    </div>
            </div>


                <div class="wrapper">
                <div class="data-wrapper">
                    <h4>Common Languages:</h4>
                    <span>${Object.values(data[0].languages)
                        .toString()
                        .split(",")
                        .join(",")}</span>
                    </div>
            </div>
             
            `;
        })
     });
    </script>


</body>
</html>
